[project]
name = "idp"
version = "0.1.0"
description = "Intelligent document processing on AWS: Textract + Claude on Amazon Bedrock + OpenSearch, with a REST API and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.13",
    "boto3>=1.40",
    "pydantic>=2.9",
    "jsonschema>=4.20",
    "aws-lambda-powertools>=3.0",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3", "httpx>=0.27"]
dev = ["pytest>=8", "moto[s3,dynamodb]>=5", "ruff>=0.6", "mcp>=2.3", "httpx>=0.27"]

[project.scripts]
idp-mcp = "idp.mcp_server.server:main"
idp-host = "idp.host.chat_host:main"
idp-eval = "idp.eval.run_eval:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]
